<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Bomberman - Un jeu de stratégie rétro">
    <title>Bomberman</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-wrapper {
            display: flex;
            flex-direction: column;
            background-color: #000;
            border: 4px solid #4b5320;
            box-shadow: 
                0 0 30px rgba(75, 83, 32, 0.8),
                inset 0 0 10px rgba(75, 83, 32, 0.3),
                0 0 60px rgba(75, 83, 32, 0.4);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }

        #hud-container {
            width: 100%;
            height: 50px;
            background-color: #0a0a0a;
            background-color: rgba(10, 10, 10, 0.95);
            border-bottom: 1px solid #4b5320;
            flex-shrink: 0;
            z-index: 1000;
            position: relative;
        }

        #game-container {
            flex: 1;
            width: 100%;
            background-color: #000;
            overflow: hidden;
            position: relative;
        }

        #game-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(
                90deg,
                rgba(255, 255, 255, 0.03),
                rgba(255, 255, 255, 0.03) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 10;
        }

        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            #game-wrapper {
                border-width: 2px;
                box-shadow: 
                    0 0 20px rgba(75, 83, 32, 0.6),
                    inset 0 0 5px rgba(75, 83, 32, 0.2);
            }
        }

        /* Effet scanlines rétro (optionnel) */
        @keyframes scanlines-move {
            0% {
                background-position: 0 0;
            }
            100% {
                background-position: 0 4px;
            }
        }
    </style>
    <!-- Phaser via CDN (loaded before main.js so window.Phaser is available) -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.js"></script>
</head>
<body>
    <div id="game-wrapper">
        <div id="hud-container"></div>
        <div id="game-container"></div>
    </div>
    <script src="main.js" type="module" defer></script>
</body>
</html>
